name: Daily S&P 500 Prediction

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 10 PM UTC Mon-Fri (after US market close at 4 PM ET)
  workflow_dispatch:           # allows manual trigger from GitHub UI

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas numpy scikit-learn xgboost joblib pyarrow scipy

      - name: Run daily prediction
        run: python -m src.daily_run

      - name: Commit and push prediction
        run: |
          git config user.email "pjlmda@users.noreply.github.com"
          git config user.name "pjlmda"
          git add data/predictions_history.json
          git diff --staged --quiet || git commit -m "Daily prediction $(date +'%Y-%m-%d')"
          git push
